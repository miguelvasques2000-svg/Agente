name: Tesla Inventory Monitor

on:
  schedule:
    # A cada 15 minutos. O GitHub Actions não garante pontualidade exata em
    # cron jobs (pode atrasar em períodos de carga), mas é suficiente para
    # este caso de uso.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tesla-inventory-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar inventário e notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python main.py --once --config config.yaml

      - name: Persistir estado (evita notificações repetidas)
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "tesla-inventory-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state
            git commit -m "chore: atualizar estado do inventário [skip ci]"
            git push
          else
            echo "Sem alterações de estado a commitar."
          fi
